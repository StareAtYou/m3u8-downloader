[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "m3u8-downloader-pro"
version = "0.2.0"
description = "Reliable terminal and desktop M3U8 downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "m3u8>=6,<7",
    "platformdirs>=4,<5",
    "pycryptodome>=3.20,<4",
    "requests[socks]>=2.32,<3",
    "rich>=14,<16",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7", "PySide6-Addons>=6.8,<7", "QtAwesome>=1.4,<2"]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "PyYAML>=6,<7", "ruff>=0.11,<1"]

[project.scripts]
m3u8-service = "m3u8_downloader.cli:service_main"
m3u8-client = "m3u8_downloader.cli:client_main"
m3u8-gui = "m3u8_downloader.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"m3u8_downloader.gui" = [
    "resources.qrc",
    "qml/*.qml",
    "qml/components/*.qml",
    "qml/dialogs/*.qml",
    "qml/pages/*.qml",
    "qml/theme/*.qml",
    "qml/theme/qmldir",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = 'black'
known_third_party = ["paddle"]


[tool.black]
line-length = 119
target_version = ['py310', 'py311', 'py312']
exclude = '.flake8'



[tool.ruff]
exclude = [
    "./build",
    "custom_ops/third_party",
]
line-length = 119
target-version = "py310"

[tool.ruff.format]
# Prevent change to double quotes by some users use ruff format
quote-style = "preserve"

[tool.ruff.lint]
ignore = [
    # Whitespace before ‘,’, ‘;’, or ‘:’, it is not compatible with black
    "E203",
    # Module level import not at top of file
    "E402",
    # Line too long (82 > 79 characters)
    "E501",
    # Do not compare types, use `isinstance()`
    "E721",
    # Do not use bare except, specify exception instead
    "E722",
    # Do not assign a lambda expression, use a def
    "E731",
    # Do not use variables named ‘l’, ‘O’, or ‘I’
    "E741",
    # `name` may be undefined, or defined from star imports: `module`
    "F405",
    # Local variable name is assigned to but never used
    "F841",
    # It not met the "Explicit is better than implicit" rule
    "UP015",
    # collections.namedtuple can be quickly created a inlined class
    "PYI024",
    # `__all__.append` is a common pattern in Paddle
    "PYI056",
]

[tool.ruff.lint.per-file-ignores]
# Ignore for re-export in __init__ files
"__init__.py" = ["PLC0414"]
